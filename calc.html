<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PMD Stat Calculator</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
    :root{
      --card-bg:#fff;
      --accent:#4a90e2;
      --muted:#f2f2f2;
    }
    body {
        font-family: Arial, sans-serif;
        background: #f6f8fb;
        margin: 20px;
        display: flex;
        justify-content: center;
    }

    .container {
      width: 900px;
      max-width: 96%;
    }

    h1 { margin-bottom: 6px; font-size: 20px; }
    label { font-weight: bold; }

    /* Card for name + sprite */
    .card {
        background: var(--card-bg);
        padding: 12px;
        border-radius: 12px;
        box-shadow: 0 6px 18px rgba(20,30,60,0.06);
        display: flex;
        gap: 16px;
        align-items: center;
        width: 100%;
        box-sizing: border-box;
        margin-bottom: 18px;
    }

    .left {
      flex: 1 1 auto;
      position: relative;
    }

    .left label { display:block; margin-bottom:6px; }
    .left input[type="text"]{
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #cfd8e6;
      font-size: 14px;
      box-sizing: border-box;
    }

    .suggestions {
      position: absolute;
      top: 76px;
      left: 0;
      right: 0;
      background: white;
      border: 1px solid #e1e6f0;
      border-radius: 8px;
      box-shadow: 0 6px 18px rgba(20,30,60,0.06);
      max-height: 180px;
      overflow-y: auto;
      display: none;
      z-index: 60;
    }
    .suggestions div { padding: 8px 10px; cursor: pointer; }
    .suggestions div:hover { background: #eef4ff; }

    .sprite {
      width: 110px;
      flex: 0 0 110px;
      text-align: center;
    }
    .sprite img {
      width: 96px;
      height: 96px;
      image-rendering: pixelated;
      border-radius: 8px;
      background: #fff;
    }
    .sprite .label { font-weight: bold; margin-top:8px; font-size:13px; }

    /* Calculator section */
    .calc {
      background: var(--card-bg);
      padding: 14px;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(20,30,60,0.04);
      margin-bottom: 18px;
    }

    .calc .row {
      display:flex;
      gap:12px;
      align-items:center;
      margin-bottom: 12px;
    }
    .calc label { margin-right: 6px; }

    input[type="number"] {
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #d0d8e6;
      width: 120px;
      box-sizing: border-box;
    }

    /* IV/EV Table */
    table {
        border-collapse: collapse;
        width: 100%;
        font-family: Arial, sans-serif;
        font-size: 14px;
        text-align: center;
        margin-top: 6px;
    }
    th, td {
        border: 1px solid #ddd;
        padding: 10px;
        width: 100px;
    }
    thead th { background-color: var(--accent); color: white; }
    tbody td:first-child { background-color: #e9f3ff; font-weight: bold; text-align: left; padding-left: 12px; }
    tbody tr:nth-child(even) { background: var(--muted); }

    /* Buttons and results */
    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    #results {
      margin-top: 12px;
      padding: 12px;
      border-radius: 10px;
      background: #fff;
      border: 1px solid #eef2fb;
    }

    /* Base stats table at page bottom */
    .basetable { margin-top: 14px; background: #fff; border-radius: 10px; padding: 10px; }
    .basetable table { font-size:13px; }
    @media (max-width: 760px){
      .card { flex-direction: column; align-items: stretch; gap:12px;}
      .sprite { order: -1; display:flex; justify-content:center;}
      .left .suggestions { top: 104px; }
      input[type="number"]{ width: 100%; }
    }
</style>
</head>
<body>
  <div class="container">
    <h1>PMD Stat Calculator</h1>

    <!-- Card: Name input + sprite (side-by-side inside card) -->
    <div class="card" aria-label="Pokémon selector">
      <div class="left">
        <label for="pokeName">Pokémon Name</label>
        <input id="pokeName" type="text" placeholder="Start typing (e.g. Pikachu)" autocomplete="off" />
        <div id="suggestions" class="suggestions" role="listbox"></div>
      </div>

      <div class="sprite" aria-hidden="false">
        <img id="sprite" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT8Z3XjB9sdU3nLa94exUGxcr6vlFhaTnNKag&s" alt="Pokémon sprite (96x96)" />
        <div class="label" id="spriteLabel">—</div>
      </div>
    </div>

    <!-- Calculator UI -->
    <div class="calc">

        <div class="row">
          <label for="level">Level</label>

        </div>

        <h3>Enter IVs & EVs Per Stat</h3>
        <table>

          <tbody>
            <tr><td>HP</td><td><input type="number" id="ivHP" value="0" min="0" max="32"></td><td><input type="number" id="evHP" value="0" min="0" max="999"></td></tr>
            <tr><td>Attack</td><td><input type="number" id="ivAtk" value="0" min="0" max="32"></td><td><input type="number" id="evAtk" value="0" min="0" max="999"></td></tr>
            <tr><td>Defense</td><td><input type="number" id="ivDef" value="0" min="0" max="32"></td><td><input type="number" id="evDef" value="0" min="0" max="999"></td></tr>
            <tr><td>Sp. Attack</td><td><input type="number" id="ivSpA" value="0" min="0" max="32"></td><td><input type="number" id="evSpA" value="0" min="0" max="999"></td></tr>
            <tr><td>Sp. Defense</td><td><input type="number" id="ivSpD" value="0" min="0" max="32"></td><td><input type="number" id="evSpD" value="0" min="0" max="999"></td></tr>
            <tr><td>Speed</td><td><input type="number" id="ivSpe" value="0" min="0" max="32"></td><td><input type="number" id="evSpe" value="0" min="0" max="999"></td></tr>
          </tbody>
        </table>

        <div style="margin-top:12px;">
          <button type="submit">Calculate</button>
        </div>
      </form>

      <div id="results" aria-live="polite"></div>
    </div>

<script>
/* ---- Data & Dex mapping ---- */
const pokemonStats = [
  { name: "Bulbasaur", hp: 45, attack: 49, defense: 49, spAttack: 65, spDefense: 65, speed: 45 },
  { name: "Charmander", hp: 39, attack: 52, defense: 43, spAttack: 60, spDefense: 50, speed: 65 },
  { name: "Squirtle", hp: 44, attack: 48, defense: 65, spAttack: 50, spDefense: 64, speed: 43 },
  { name: "Pikachu", hp: 35, attack: 55, defense: 40, spAttack: 50, spDefense: 50, speed: 90 },
  { name: "Vulpix", hp: 38, attack: 41, defense: 40, spAttack: 50, spDefense: 65, speed: 65 },
  { name: "Eevee", hp: 55, attack: 55, defense: 50, spAttack: 45, spDefense: 65, speed: 55 },
  { name: "Chikorita", hp: 45, attack: 49, defense: 65, spAttack: 49, spDefense: 65, speed: 45 },
  { name: "Cyndaquil", hp: 39, attack: 52, defense: 43, spAttack: 60, spDefense: 50, speed: 65 },
  { name: "Quilava", hp: 58, attack: 64, defense: 58, spAttack: 80, spDefense: 65, speed: 80 },
  { name: "Totodile", hp: 50, attack: 65, defense: 64, spAttack: 44, spDefense: 48, speed: 43 },
  { name: "Croconaw", hp: 65, attack: 80, defense: 80, spAttack: 59, spDefense: 63, speed: 58 },
  { name: "Phanpy", hp: 90, attack: 60, defense: 60, spAttack: 40, spDefense: 40, speed: 40 },
  { name: "Treecko", hp: 40, attack: 45, defense: 35, spAttack: 65, spDefense: 55, speed: 70 },
  { name: "Torchic", hp: 45, attack: 60, defense: 40, spAttack: 70, spDefense: 50, speed: 45 },
  { name: "Mudkip", hp: 50, attack: 70, defense: 50, spAttack: 50, spDefense: 50, speed: 40 },
  { name: "Skitty", hp: 50, attack: 45, defense: 45, spAttack: 35, spDefense: 35, speed: 50 },
  { name: "Turtwig", hp: 55, attack: 68, defense: 64, spAttack: 45, spDefense: 55, speed: 31 },
  { name: "Chimchar", hp: 44, attack: 58, defense: 44, spAttack: 58, spDefense: 44, speed: 61 },
  { name: "Piplup", hp: 53, attack: 51, defense: 53, spAttack: 61, spDefense: 56, speed: 40 },
  { name: "Shinx", hp: 45, attack: 65, defense: 34, spAttack: 40, spDefense: 34, speed: 45 },
  { name: "Riolu", hp: 40, attack: 70, defense: 40, spAttack: 35, spDefense: 40, speed: 60 }
];

// mapping name -> national dex number (for sprite URL)
const nameToDex = {
  "bulbasaur": 1,
  "charmander": 4,
  "squirtle": 7,
  "pikachu": 25,
  "vulpix": 37,
  "eevee": 133,
  "chikorita": 152,
  "cyndaquil": 155,
  "quilava": 156,
  "totodile": 158,
  "croconaw": 159,
  "phanpy": 231,
  "treecko": 252,
  "torchic": 255,
  "mudkip": 258,
  "skitty": 300,
  "turtwig": 387,
  "chimchar": 390,
  "piplup": 393,
  "shinx": 403,
  "riolu": 447
};

/* DOM references */
const pokeInput = document.getElementById("pokeName");
const suggestions = document.getElementById("suggestions");
const spriteImg = document.getElementById("sprite");
const spriteLabel = document.getElementById("spriteLabel");
const resultsDiv = document.getElementById("results");

/* Build simple local names array for autocomplete */
const pokemonNames = pokemonStats.map(p => p.name);

/* AUTOCOMPLETE handling */
pokeInput.addEventListener("input", function(){
  const q = pokeInput.value.trim().toLowerCase();
  suggestions.innerHTML = "";
  if (!q) {
    suggestions.style.display = "none";
    return;
  }
  const matches = pokemonNames.filter(n => n.toLowerCase().startsWith(q)).slice(0, 12);
  matches.forEach(name => {
    const d = document.createElement("div");
    d.textContent = name;
    d.onclick = () => {
      pokeInput.value = name;
      suggestions.style.display = "none";
      showSpriteFor(name);
    };
    suggestions.appendChild(d);
  });
  suggestions.style.display = matches.length ? "block" : "none";
});

/* hide suggestions on click outside */
document.addEventListener("click", (e) => {
  if (!e.target.closest(".left")) suggestions.style.display = "none";
});

/* Show sprite using National Dex number mapping (generation-iv diamond-pearl) */
function showSpriteFor(name){
  if (!name) {
    spriteImg.src = "";
    spriteLabel.textContent = "—";
    return;
  }
  const key = name.toLowerCase();
  const dex = nameToDex[key];
  if (!dex) {
    // fallback: try using lowercase name in a different sprite repo (best effort)
    spriteImg.src = "";
    spriteImg.alt = "";
    spriteLabel.textContent = name + " (sprite not mapped)";
    return;
  }
  // diamond/pearl gen4 sprite path (96x96-ish)
  const url = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-iv/diamond-pearl/${dex}.png`;
  spriteImg.src = url;
  spriteImg.alt = name;
  spriteLabel.textContent = name;
}

/* Load sprite when input loses focus (if name recognized) */
pokeInput.addEventListener("change", () => {
  showSpriteFor(pokeInput.value.trim());
});

/* Calculation logic (unchanged formulas) */
document.getElementById("pokemonForm").addEventListener("submit", function(e){
  e.preventDefault();

  const name = pokeInput.value.trim();
  const lvl = parseInt(document.getElementById("level").value) || 50;

  const pokemon = pokemonStats.find(p => p.name.toLowerCase() === name.toLowerCase());
  if (!pokemon) {
    resultsDiv.innerHTML = `<strong>Pokémon not found. Make sure spelling matches (e.g. Pikachu).</strong>`;
    return;
  }

  // Collect IVs and EVs (per-stat)
  const iv = {
    hp: parseInt(document.getElementById("ivHP").value) || 0,
    atk: parseInt(document.getElementById("ivAtk").value) || 0,
    def: parseInt(document.getElementById("ivDef").value) || 0,
    spa: parseInt(document.getElementById("ivSpA").value) || 0,
    spd: parseInt(document.getElementById("ivSpD").value) || 0,
    spe: parseInt(document.getElementById("ivSpe").value) || 0
  };
  const ev = {
    hp: parseInt(document.getElementById("evHP").value) || 0,
    atk: parseInt(document.getElementById("evAtk").value) || 0,
    def: parseInt(document.getElementById("evDef").value) || 0,
    spa: parseInt(document.getElementById("evSpA").value) || 0,
    spd: parseInt(document.getElementById("evSpD").value) || 0,
    spe: parseInt(document.getElementById("evSpe").value) || 0
  };

  // HP formula: FLOOR((((Base*2)+IV+(EV/4))*(Level/100))+Level+30,1)
  const calcHP = (base, ivv, evv) => Math.floor(((base * 2 + ivv + (evv/4)) * (lvl / 100)) + lvl + 30);

  // Others: FLOOR((((Base*2)+IV+(EV/4))*(Level/100))+5,1)
  const calcOther = (base, ivv, evv) => Math.floor(((base * 2 + ivv + (evv/4)) * (lvl / 100)) + 5);

  const out = {
    HP: calcHP(pokemon.hp, iv.hp, ev.hp),
    Attack: calcOther(pokemon.attack, iv.atk, ev.atk),
    Defense: calcOther(pokemon.defense, iv.def, ev.def),
    "Sp. Attack": calcOther(pokemon.spAttack, iv.spa, ev.spa),
    "Sp. Defense": calcOther(pokemon.spDefense, iv.spd, ev.spd),
    Speed: calcOther(pokemon.speed, iv.spe, ev.spe)
  };

  // Show sprite for the selected Pokémon (ensures sprite is present)
  showSpriteFor(name);

  // Render results
resultsDiv.innerHTML = `
  <h3>${pokemon.name} — Calculated Stats (Level ${lvl})</h3>
  <table>
    <tr>
      <th>Stat</th>
      <th>Value</th>
      <th>Modifier</th>
    </tr>
    <tr>
      <td>HP</td>
      <td>${out.HP}</td>
      <td>${Math.floor((out.HP - (lvl + 25)) / 5)}</td>
    </tr>
    <tr>
      <td>Attack</td>
      <td>${out.Attack}</td>
      <td>${Math.floor(out.Attack / 5)}</td>
    </tr>
    <tr>
      <td>Defense</td>
      <td>${out.Defense}</td>
      <td>${Math.floor(out.Defense / 5)}</td>
    </tr>
    <tr>
      <td>Sp. Attack</td>
      <td>${out['Sp. Attack']}</td>
      <td>${Math.floor(out['Sp. Attack'] / 5)}</td>
    </tr>
    <tr>
      <td>Sp. Defense</td>
      <td>${out['Sp. Defense']}</td>
      <td>${Math.floor(out['Sp. Defense'] / 5)}</td>
    </tr>
    <tr>
      <td>Speed</td>
      <td>${out.Speed}</td>
      <td>${Math.floor(out.Speed / 5)}</td>
    </tr>
  </table>
`;
});
</script><br>
</body>
