<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#080d1c">
<title>Snowlotus/Mapledawn Season Time</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#080d1c;--bg2:#1b2c5c;--bg3:#41190f;--panel:#101935;--cell:#070b18;--text:#eaf3ff;--dim:#8fa3c7;--frost:#bfe8ff;--ember:#ff9d4d;
--c-rec:#6fd6f5;--c-evt:#ff8a3d;--c-dgn:#b69cff;--c-link:#f4cf6b;
color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#080d1c;--bg2:#1b2c5c;--bg3:#41190f;--panel:#101935;--cell:#070b18;--text:#eaf3ff;--dim:#8fa3c7}}
:root[data-theme="dark"]{--bg:#080d1c;--bg2:#1b2c5c;--bg3:#41190f;--panel:#101935;--cell:#070b18;--text:#eaf3ff;--dim:#8fa3c7}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px);overscroll-behavior-y:none}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;background:transparent;color:var(--text);font-family:'Cinzel',Georgia,serif;display:flex;justify-content:center;padding:24px 16px;overflow-x:hidden}
/* winter glow top-left, autumn ember bottom-right */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 10% 0,var(--bg2) 0,transparent 58%),radial-gradient(ellipse at 95% 100%,var(--bg3) 0,transparent 58%),var(--bg)}
.snow{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.snow i{position:absolute;top:-14px;border-radius:50%;background:#fff;opacity:.7;animation:fall linear infinite}
.snow i.lf{border-radius:0 100% 0 100%}
@keyframes fall{to{transform:translate3d(var(--dx),105vh,0) rotate(var(--rot,0deg))}}
@media (prefers-reduced-motion:reduce){.snow{display:none}}
.wrap{position:relative;z-index:1;width:100%;max-width:760px}

/* title lockup */
h1{margin:4px 0 6px;text-align:center;font-weight:700}
.realms{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.realm{display:flex;flex-direction:column;align-items:center;gap:6px}
.realm svg{display:block}
.realm.snowr svg{filter:drop-shadow(0 0 8px rgba(111,214,245,.8))}
.realm.maple svg{filter:drop-shadow(0 0 8px rgba(255,140,60,.8))}
.nm{display:block;font-family:'Cinzel Decorative','Cinzel',Georgia,serif;font-size:clamp(1.05rem,4.6vw,2.2rem);letter-spacing:.04em;line-height:1.1;-webkit-background-clip:text;background-clip:text;color:transparent}
.snowr .nm{background-image:linear-gradient(180deg,#ffffff,#9fdcff);filter:drop-shadow(0 0 10px rgba(111,214,245,.5))}
.maple .nm{background-image:linear-gradient(180deg,#ffe29a,#ff9d4d 55%,#e0522d);filter:drop-shadow(0 0 10px rgba(255,140,60,.5))}
.vr{width:2px;align-self:stretch;min-height:64px;background:linear-gradient(180deg,transparent,#bfe8ff 25%,#ff9d4d 75%,transparent)}
.ttl{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:12px;font-family:'Cinzel',Georgia,serif;font-weight:800;font-size:clamp(.9rem,3.4vw,1.25rem);letter-spacing:.5em;text-transform:uppercase;color:var(--text)}
.ttl::before,.ttl::after{content:"";flex:1;max-width:90px;height:1px}
.ttl::before{background:linear-gradient(90deg,transparent,#bfe8ff)}
.ttl::after{background:linear-gradient(90deg,#ff9d4d,transparent)}
.sub{text-align:center;color:var(--dim);font-size:.75rem;letter-spacing:.3em;text-transform:uppercase;margin:10px 0 22px}

.panel{border:2px solid transparent;background:linear-gradient(180deg,var(--panel),#0b1229) padding-box,linear-gradient(90deg,#bfe8ff,#ff9d4d) border-box;border-radius:14px;box-shadow:0 0 0 4px #000,0 0 0 6px #5b5470,-14px 0 34px rgba(111,214,245,.18),14px 0 34px rgba(255,140,60,.18);padding:22px 14px}
.day{text-align:center;font-size:1.05rem;letter-spacing:.35em;color:var(--dim);text-transform:uppercase}
.daynum{text-align:center;font-weight:800;font-size:clamp(4rem,18vw,7.5rem);line-height:1;margin:4px 0 16px;background:linear-gradient(90deg,#bfe8ff,#ffe3b8,#ff9d4d);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(255,190,120,.3))}
.clock{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cell{background:var(--cell);border:1px solid rgba(191,232,255,.45);border-radius:8px;padding:10px 4px;text-align:center}
.cell b{display:block;font-size:clamp(1.6rem,7vw,2.8rem);font-variant-numeric:tabular-nums}
.cell span{font-size:.65rem;letter-spacing:.25em;color:var(--dim);text-transform:uppercase}
.next{text-align:center;color:var(--dim);font-size:.75rem;margin-top:14px;letter-spacing:.15em;font-variant-numeric:tabular-nums}
.next div+div{margin-top:5px}

.sec{margin-top:30px}
.sec.rec{--c:var(--c-rec)}.sec.evt{--c:var(--c-evt)}.sec.dgn{--c:var(--c-dgn)}.sec.lnk{--c:var(--c-link)}
h2{font-family:'Cinzel Decorative','Cinzel',Georgia,serif;color:var(--c);text-align:center;margin:0 0 4px;font-size:1.3rem;letter-spacing:.1em;text-shadow:0 0 14px var(--c)}
.hint{text-align:center;color:var(--dim);font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;margin-bottom:12px}
.rule{height:2px;background:linear-gradient(90deg,transparent,var(--c),transparent);margin:0 auto 14px;max-width:320px}
.card{background:var(--panel);border:1px solid var(--c);border-left:5px solid var(--c);border-radius:8px;padding:12px 14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 0 12px -6px var(--c)}
.card .n,.dg .n{font-weight:800;color:var(--c)}
.card .d,.dg .d{font-size:.7rem;color:var(--dim);letter-spacing:.15em;text-transform:uppercase}
.card .t{font-variant-numeric:tabular-nums;font-size:1.1rem}
.card.done{opacity:.55}
a.card{text-decoration:none;color:var(--c);font-weight:800;letter-spacing:.05em;display:block}
a.card:hover{box-shadow:0 0 18px -2px var(--c);color:var(--text)}
a.card small{display:block;color:var(--dim);font-weight:600;font-size:.7rem;letter-spacing:.1em;margin-top:2px}
.empty{text-align:center;color:var(--dim)}
/* dungeons (expandable) */
.dg{background:var(--panel);border:1px solid var(--c);border-left:5px solid var(--c);border-radius:8px;margin-bottom:10px;box-shadow:0 0 12px -6px var(--c)}
.dg[open]{box-shadow:0 0 18px -4px var(--c)}
.dg summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.dg summary::-webkit-details-marker{display:none}
.dg summary:focus-visible{outline:2px solid var(--c);outline-offset:2px;border-radius:6px}
.dg .st{display:flex;align-items:center;gap:12px;font-variant-numeric:tabular-nums;font-size:1rem}
.dg .st::after{content:"";width:8px;height:8px;border-right:2px solid var(--c);border-bottom:2px solid var(--c);transform:rotate(45deg);transition:transform .2s;margin-bottom:3px}
.dg[open] .st::after{transform:rotate(-135deg);margin-bottom:-3px}
.dg .body{padding:12px 14px 14px;border-top:1px dashed var(--c)}
.dg p{margin:0 0 12px;font-size:.85rem;line-height:1.55;font-weight:600}
.dg dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0;font-size:.85rem}
.dg dt{color:var(--dim);letter-spacing:.12em;text-transform:uppercase;font-size:.65rem;align-self:center}
.dg dd{margin:0;font-weight:600}
</style>
</head>
<body>
<div class="bg"></div>
<div class="snow" id="snow"></div>
<div class="wrap">
  <h1>
    <span class="realms">
      <span class="realm snowr">
        <svg width="54" height="33" viewBox="0 0 64 40" aria-hidden="true">
          <g fill="#cfeeff" stroke="#ffffff" stroke-width="1">
            <path id="p" d="M32 3C41 14 41 28 32 37 23 28 23 14 32 3Z"/>
            <use href="#p" transform="rotate(-32 32 37)" fill="#8fd0f2"/>
            <use href="#p" transform="rotate(32 32 37)" fill="#8fd0f2"/>
            <use href="#p" transform="rotate(-62 32 37)" fill="#5aa9e0"/>
            <use href="#p" transform="rotate(62 32 37)" fill="#5aa9e0"/>
          </g>
        </svg>
        <span class="nm">Snowlotus</span>
      </span>
      <span class="vr"></span>
      <span class="realm maple">
        <svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 1L14.2 6 18 4.5 17 10.5 22 9.5 19 14 21 15.5 13 17 13 23 11 23 11 17 3 15.5 5 14 2 9.5 7 10.5 6 4.5 9.8 6Z" fill="#ff9d4d" stroke="#ffd2a1" stroke-width=".8" stroke-linejoin="round"/>
        </svg>
        <span class="nm">Mapledawn</span>
      </span>
    </span>
    <span class="ttl">Season Time</span>
  </h1>
  <div class="sub">How long since the season started</div>

  <div class="panel">
    <div class="day">Season Day</div>
    <div class="daynum" id="day">--</div>
    <div class="clock">
      <div class="cell"><b id="h">--</b><span>Hours</span></div>
      <div class="cell"><b id="m">--</b><span>Minutes</span></div>
      <div class="cell"><b id="s">--</b><span>Seconds</span></div>
    </div>
    <div class="next">
      <div id="server"></div>
      <div id="next"></div>
    </div>
  </div>

  <div class="sec rec">
    <h2>Recurring Events</h2><div class="hint">Repeats on a cycle</div><div class="rule"></div>
    <div id="recurring"></div>
  </div>

  <div class="sec evt">
    <h2>Server Events</h2><div class="hint">One-time milestones</div><div class="rule"></div>
    <div id="events"></div>
  </div>

  <div class="sec dgn">
    <h2>Dungeons</h2><div class="hint">Tap to expand</div><div class="rule"></div>
    <div id="dungeons"></div>
  </div>

  <div class="sec lnk">
    <h2>Helpful Links</h2><div class="hint">Guides &amp; tools</div><div class="rule"></div>
    <div id="links"></div>
  </div>
</div>

<script>
// =====================================================================
//  TIMER RESETS  (the only lines you edit to reset a timer)
//  Both start at 9:00 AM Eastern on the date given. month is 1-12.
//
//  NEW SEASON  -> change SEASON_START to the new season's start date.
//                 The season day counter restarts at Day 0 on that date.
//                 Event/dungeon day numbers below count from the season
//                 start, so update those for the new season too.
//  SERVER RESET (rare) -> change SERVER_START. Leave it alone when only
//                 the season resets: total server time keeps counting.
// =====================================================================
const SEASON_START = { year: 2026, month: 9, day: 18 };
const SERVER_START = { year: 2026, month: 9, day: 18 };
// =====================================================================

// ===== RECURRING EVENTS: name, day = first occurrence, every = repeat interval in days =====
const RECURRING = [
  { name: "Server Tournament begins", day: 22, every: 7 },
  { name: "Weekly Reset", day: 24, every: 7 },
  { name: "Grand Treasure Hunt resets", day: 22, every: 7 },
  { name: "Pilgrimage Pass resets", day: 15, every: 14 },
  { name: "Void Rift event", day: 37, every: 14 },
  { name: "Chaos Invasion event", day: 30, every: 14 }
];

// ===== SERVER EVENTS (one-time): name + day number =====
const EVENTS = [
  { name: "Aquorigin Shrine dungeon opens", day: 24 },
  { name: "Whaleback Island arrives", day: 26 },
  { name: "Hellhold dungeon opens", day: 33 },
  { name: "Wonder Flavors event ends", day: 36 },
  { name: "Stellar Plume gacha ends", day: 36 },
  { name: "End of season 1 (approximate)", day: 45 }
];

// ===== DUNGEONS (tap to expand) =====
// name  = dungeon name
// day   = (optional) day it opens; shows a countdown, then "Open"
// desc  = (optional) short description paragraph
// info  = (optional) list of ["Label", "Value"] rows
const DUNGEONS = [
  { name: "Aquorigin Shrine", day: 24,
    desc: "A sacred shrine for river deities. In its depths an ancient entity stands eternal watch.",
    info: [["Level Requirement", "100"],["Normal", "930K"], ["Hard", "1.45M"], ["Nightmare", "2.05M"]] },
  { name: "Hellhold", day: 33,
    desc: "A ruined ancient city built overnight. It stands like a ghost-infested gateway, leading straight into the underworld.",
    info: [["Normal", "2.25M"], ["Hard", "2.75M"], ["Nightmare", "3.9M"], ["Purgatory", "6.2M"]] }
];

// ===== LINKS: name + url (+ optional note) =====
const LINKS = [
  { name: "Primostar Calculator", url: "https://eog.gg/games/sword-x-staff/tools/star-calculator/", note: "Calculate your Primordial Star rewards before the end of the season" },
  { name: "Generic Game Calendar", url: "https://qymaple.github.io/sxs-research-global/maple-sxs-timeline.html", note: "Raw Calendar Data" },
  { name: "Guides and Calculators", url: "https://eog.gg/games/sword-x-staff/", note: "Tons of Guides and Builds" },
  { name: "Datamined Information", url: "https://purrwikimania.vercel.app/index.html", note: "Info Datamined directly from the code" }
];
// ======================================================

const TZ = "America/New_York";   // 9:00 AM Eastern (EST/EDT as observed)

function tzOffset(ms){
  const p = {};
  new Intl.DateTimeFormat("en-US",{timeZone:TZ,hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"})
    .formatToParts(new Date(ms)).forEach(x=>p[x.type]=x.value);
  return Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute,+p.second) - Math.floor(ms/1000)*1000;
}
function nineAM(y,mo,d){
  const guess = Date.UTC(y,mo-1,d,9,0,0);
  let t = guess - tzOffset(guess);
  t = guess - tzOffset(t);
  return t;
}
// start (UTC ms) of season day n = 9 AM Eastern, n days after SEASON_START
function dayStart(n){ return nineAM(SEASON_START.year, SEASON_START.month, SEASON_START.day + n); }
const SERVER_MS = nineAM(SERVER_START.year, SERVER_START.month, SERVER_START.day);

function currentDay(now){
  let n = Math.floor((now - dayStart(0))/86400000);
  while (dayStart(n+1) <= now) n++;
  while (dayStart(n) > now) n--;
  return n;
}
const pad = x => String(x).padStart(2,"0");
function split(ms){
  let s = Math.max(0, Math.floor(ms/1000));
  const d = Math.floor(s/86400); s%=86400;
  const h = Math.floor(s/3600); s%=3600;
  return { d, h, m: Math.floor(s/60), s: s%60 };
}
const esc = v => String(v).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = ms => { const r = split(ms); return r.d+"d "+pad(r.h)+"h "+pad(r.m)+"m "+pad(r.s)+"s"; };
const card = (name, label, txt, done) =>
  '<div class="card'+(done?' done':'')+'"><div><div class="n">'+esc(name)+'</div><div class="d">'+label+'</div></div><div class="t">'+txt+'</div></div>';

const el = id => document.getElementById(id);
function nextOccurrence(e, cur, now){
  const k = e.day >= cur ? 0 : Math.ceil((cur - e.day)/e.every);
  let n = e.day + k*e.every;
  if (dayStart(n) <= now) n += e.every;
  return n;
}
function tick(){
  const now = Date.now();
  const n = currentDay(now);
  const t = split(now - dayStart(n));
  el("day").textContent = n;
  el("h").textContent = pad(t.h);
  el("m").textContent = pad(t.m);
  el("s").textContent = pad(t.s);

  const sv = now - SERVER_MS;
  el("server").textContent = sv < 0 ? "Server launches in "+fmt(-sv) : "Total server time: "+fmt(sv);
  const nx = split(dayStart(n+1) - now);
  el("next").textContent = "Day "+(n+1)+" dawns in "+pad(nx.h)+":"+pad(nx.m)+":"+pad(nx.s);

  const rec = RECURRING.map(e=>({e, d:nextOccurrence(e,n,now)})).sort((a,b)=>a.d-b.d);
  el("recurring").innerHTML = rec.length ? rec.map(x=>
    card(x.e.name, "Next: Day "+x.d+" &middot; every "+x.e.every+" days", fmt(dayStart(x.d)-now), false)).join("")
    : '<div class="empty">No recurring events.</div>';

  const list = [...EVENTS].sort((a,b)=>a.day-b.day);
  el("events").innerHTML = list.length ? list.map(e=>{
    const diff = dayStart(e.day) - now;
    return card(e.name, "Day "+e.day, diff<=0 ? "Underway!" : fmt(diff), diff<=0);
  }).join("") : '<div class="empty">No events scheduled.</div>';

  // dungeon countdowns (updated in place so expanded cards stay open)
  document.querySelectorAll("#dungeons [data-day]").forEach(s=>{
    const diff = dayStart(+s.dataset.day) - now;
    s.textContent = diff <= 0 ? "Open" : fmt(diff);
  });
}

// dungeons render once so open/closed state isn't reset every second
el("dungeons").innerHTML = DUNGEONS.map(d=>{
  const hasDay = d.day !== undefined && d.day !== null;
  const rows = (d.info||[]).map(r=>'<dt>'+esc(r[0])+'</dt><dd>'+esc(r[1])+'</dd>').join("");
  return '<details class="dg"><summary><div><div class="n">'+esc(d.name)+'</div>'+
    (hasDay?'<div class="d">Opens Day '+esc(d.day)+'</div>':'')+'</div>'+
    '<div class="st">'+(hasDay?'<span data-day="'+esc(d.day)+'"></span>':'')+'</div></summary>'+
    '<div class="body">'+(d.desc?'<p>'+esc(d.desc)+'</p>':'')+(rows?'<dl>'+rows+'</dl>':'')+'</div></details>';
}).join("") || '<div class="empty">No dungeons listed.</div>';

el("links").innerHTML = LINKS.filter(l=>/^https?:\/\//i.test(l.url)).map(l=>
  '<a class="card" href="'+esc(l.url)+'" target="_blank" rel="noopener noreferrer">&#10048; '+esc(l.name)+(l.note?'<small>'+esc(l.note)+'</small>':'')+'</a>'
).join("") || '<div class="empty">No links yet.</div>';

(function(){ // falling snow + autumn leaves
  const box = el("snow"), leaves = ["#ff9d4d","#e0622d","#c9792b","#f2b24a"];
  for (let i=0;i<40;i++){
    const f = document.createElement("i"), leaf = i%3===0;
    const s = leaf ? 6+Math.random()*6 : 2+Math.random()*4;
    f.className = leaf ? "lf" : "";
    f.style.cssText = "left:"+Math.random()*100+"%;width:"+s+"px;height:"+s+"px;animation-duration:"+(8+Math.random()*10)+"s;animation-delay:-"+Math.random()*14+"s;--dx:"+(Math.random()*90-45)+"px;--rot:"+(Math.random()*720-360)+"deg;opacity:"+(.4+Math.random()*.5)+(leaf?";background:"+leaves[i%leaves.length]:"");
    box.appendChild(f);
  }
})();
tick(); setInterval(tick, 1000);
</script>
</body>
</html>
